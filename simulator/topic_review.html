<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>護理立場模擬器主題表</title>
    <link rel="stylesheet" href="./styles.css?v=20260619-simulator2" />
    <style>
      .review-tools {
        display: grid;
        grid-template-columns: 1fr 240px;
        gap: 10px;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .review-tools input,
      .review-tools select {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 12px;
        font: inherit;
        color: var(--ink);
        background: white;
      }

      .topic-list {
        display: grid;
        gap: 0;
      }

      .review-card {
        border-bottom: 1px solid var(--line);
        padding: 18px 0;
      }

      .review-card summary {
        list-style: none;
        cursor: pointer;
      }

      .review-card summary::-webkit-details-marker {
        display: none;
      }

      .card-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: start;
      }

      .card-id {
        color: var(--aqua);
        font-weight: 900;
        margin-bottom: 4px;
      }

      .card-title {
        margin: 0;
        font-size: 22px;
        line-height: 1.35;
      }

      .card-group {
        color: var(--muted);
        font-weight: 800;
        white-space: nowrap;
      }

      .card-position {
        margin-top: 10px;
        color: var(--muted);
        line-height: 1.75;
      }

      .card-body {
        margin-top: 16px;
        display: grid;
        gap: 16px;
      }

      .review-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .review-section {
        background: var(--soft);
        border-left: 4px solid var(--aqua);
        padding: 12px;
      }

      .review-section h3 {
        margin-top: 0;
      }

      .source-item {
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      .source-item:first-child {
        border-top: 0;
      }

      .source-item p {
        line-height: 1.65;
      }

      .source-item small {
        display: block;
        color: var(--muted);
        line-height: 1.6;
      }

      .status-note {
        margin-top: 12px;
        padding: 12px;
        background: #fffdf2;
        border: 1px solid #eadca3;
        border-radius: 6px;
        line-height: 1.7;
      }

      @media (max-width: 760px) {
        .review-tools,
        .card-head,
        .review-grid {
          grid-template-columns: 1fr;
        }

        .card-group {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="toolbar">
        <div>
          <p class="eyebrow">草稿審核版</p>
          <h1>完整主題表</h1>
          <p id="metaLine">資料載入中</p>
        </div>
        <a class="source-link" href="./index.html">回模擬器</a>
      </section>

      <section class="input-panel">
        <h2>這頁怎麼用</h2>
        <p class="position">
          先不要把它當成查詢頁。這頁是用來確認「模擬器有哪些主題、每個主題的立場是否合理、代表函釋有沒有抓對」。
          你可以先看主題名稱與立場摘要；覺得需要檢查時，再點開看判斷問題與來源。
        </p>
        <p class="status-note">
          審核時只要想三件事：這個主題要不要保留？立場有沒有偏掉？代表來源夠不夠準？
        </p>
      </section>

      <section class="review-tools" aria-label="主題篩選">
        <input id="reviewSearch" type="search" placeholder="搜尋主題，例如：學校、幼兒園、醫療輔助、照顧服務員" />
        <select id="groupFilter">
          <option value="">全部大類</option>
        </select>
      </section>

      <section class="summary">
        <strong id="topicCount">0 個主題</strong>
        <span id="topicHint">點開任一主題可看來源。</span>
      </section>

      <section id="topicList" class="topic-list"></section>
    </main>

    <template id="reviewCardTemplate">
      <details class="review-card">
        <summary>
          <div class="card-head">
            <div>
              <p class="card-id"></p>
              <h2 class="card-title"></h2>
              <p class="card-position"></p>
            </div>
            <p class="card-group"></p>
          </div>
        </summary>
        <div class="card-body">
          <div class="review-grid">
            <div class="review-section">
              <h3>判斷問題</h3>
              <ul class="questions"></ul>
            </div>
            <div class="review-section">
              <h3>可能結論</h3>
              <ul class="outputs"></ul>
            </div>
          </div>
          <div class="review-section">
            <h3>代表來源</h3>
            <div class="sources"></div>
          </div>
        </div>
      </details>
    </template>

    <script src="./data/simulator_topics.js?v=20260619-simulator2"></script>
    <script>
      const data = window.SIMULATOR_TOPICS || { metadata: {}, topics: [] };
      const topics = data.topics || [];
      const metaLine = document.querySelector("#metaLine");
      const reviewSearch = document.querySelector("#reviewSearch");
      const groupFilter = document.querySelector("#groupFilter");
      const topicCount = document.querySelector("#topicCount");
      const topicHint = document.querySelector("#topicHint");
      const topicList = document.querySelector("#topicList");
      const template = document.querySelector("#reviewCardTemplate");

      function escapeHtml(text) {
        return String(text || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function sourceLine(source) {
        const date = source.citation_date || source.date || "日期待補";
        const docNo = source.citation_document_no || source.document_no || "字號待補";
        const title = source.title || "標題待補";
        const parts = [];
        if (source.printed_page) parts.push(`書上頁碼 ${source.printed_page}`);
        if (source.physical_page) parts.push(`PDF頁碼 ${source.physical_page}`);
        if (source.source_url) parts.push(`<a href="${escapeHtml(source.source_url)}" target="_blank" rel="noreferrer">原文網址</a>`);
        return `${escapeHtml(date)}，${escapeHtml(docNo)}，${escapeHtml(title)}${parts.length ? `（${parts.join("；")}）` : ""}`;
      }

      function init() {
        metaLine.textContent = `${data.metadata.topic_count || topics.length} 個主題，${data.metadata.source_count || 0} 筆代表來源`;
        const groups = [...new Set(topics.map((topic) => topic.group).filter(Boolean))];
        for (const group of groups) {
          const option = document.createElement("option");
          option.value = group;
          option.textContent = group;
          groupFilter.append(option);
        }
        render();
      }

      function render() {
        const query = reviewSearch.value.trim();
        const group = groupFilter.value;
        const compact = query.replace(/\s+/g, "");
        const filtered = topics.filter((topic) => {
          if (group && topic.group !== group) return false;
          if (!compact) return true;
          const text = [
            topic.id,
            topic.name,
            topic.group,
            topic.position,
            ...(topic.keywords || []),
            ...(topic.scenario_triggers || []),
          ].join("");
          return text.includes(compact);
        });

        topicCount.textContent = `${filtered.length} 個主題`;
        topicHint.textContent = query || group ? "目前顯示篩選後的主題。" : "建議先看學校、幼兒園、醫療輔助、非醫事人員幾個主題。";
        topicList.replaceChildren();

        for (const topic of filtered) {
          const node = template.content.cloneNode(true);
          node.querySelector(".card-id").textContent = topic.id;
          node.querySelector(".card-title").textContent = topic.name;
          node.querySelector(".card-group").textContent = topic.group;
          node.querySelector(".card-position").textContent = topic.position;

          const questions = node.querySelector(".questions");
          for (const question of topic.decision_questions || []) {
            const li = document.createElement("li");
            li.textContent = question;
            questions.append(li);
          }

          const outputs = node.querySelector(".outputs");
          for (const output of topic.likely_outputs || []) {
            const li = document.createElement("li");
            li.textContent = output;
            outputs.append(li);
          }

          const sources = node.querySelector(".sources");
          for (const source of topic.sources || []) {
            const div = document.createElement("div");
            div.className = "source-item";
            div.innerHTML = `<p>${sourceLine(source)}</p><small>${escapeHtml((source.excerpt || "").slice(0, 240))}</small>`;
            sources.append(div);
          }
          if (!sources.children.length) {
            const div = document.createElement("div");
            div.className = "source-item";
            div.textContent = "待補代表來源";
            sources.append(div);
          }

          topicList.append(node);
        }
      }

      reviewSearch.addEventListener("input", render);
      groupFilter.addEventListener("change", render);
      init();
    </script>
  </body>
</html>
